plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chess.syncoverlay'
    compileSdk 34

    defaultConfig {
        applicationId "com.chess.syncoverlay"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "11.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
